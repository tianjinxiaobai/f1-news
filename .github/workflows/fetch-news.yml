name: fetch-f1-news

on:
  # 每小时第 17 分跑一次（避开整点高峰，排队更快）
  schedule:
    - cron: '17 * * * *'
  # 也可以在网页上手动点一下就跑
  workflow_dispatch:

# 不开这个，最后一步 git push 必失败
permissions:
  contents: write

# 手动点「Run workflow」时如果正好撞上定时任务，两次运行会同时 push 打架。
# 这个组让它们排队，而不是并发。
concurrency:
  group: fetch-f1-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并生成 news.json
        run: node fetch-news.js

      - name: 提交变更
        run: |
          git config user.name "f1-news-bot"
          git config user.email "f1-news-bot@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "内容没变化，跳过提交"
          else
            git commit -m "chore: update f1 news $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
